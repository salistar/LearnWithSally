[project]
name = "learnwithsally-teacher"
version = "0.1.0"
description = "Sally, the AI voice teacher of LearnWithSally (Stream Vision Agents + OpenAI Realtime)"
requires-python = ">=3.12"
# Pinned: vision-agents 0.6.2+ removed the Realtime*SpeechTranscriptionEvent
# events used for live captions. Upgrade only together with main.py.
dependencies = [
    "vision-agents==0.6.0",
    "vision-agents-plugins-getstream==0.6.0",
    "vision-agents-plugins-openai==0.6.0",
    "python-dotenv>=1.0",
    "getstream[telemetry,webrtc]==3.3.4",
]
